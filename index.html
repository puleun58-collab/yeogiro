async function moveJourney(dir){let list=trip().items.filter(i=>i.day===selected&&i.lat&&i.lng).sort((a,b)=>a.time.localeCompare(b.time)),target=Math.max(0,Math.min(list.length-1,journey+dir));if(target===journey)return;if(dir>0){let r=map.routes[journey]||[[list[journey].lat,list[journey].lng],[list[target].lat,list[target].lng]],dur=Math.min(4000,Math.max(1600,r.length*35)),st=performance.now(),z=map.zoom,el=$('#map');await new Promise(done=>{function step(now){let q=Math.min(1,(now-st)/dur),idx=Math.min(r.length-1,Math.floor(q*(r.length-1))),pt=r[idx],c=project(map.cy,map.cx,z),p=project(pt[0],pt[1],z),xy=[p.x-(c.x-el.clientWidth/2),p.y-(c.y-el.clientHeight/2)];placeCharacter(xy,list[target].move,Math.floor(now/180)%2);if(xy[0]<60||xy[0]>el.clientWidth-60||xy[1]<60||xy[1]>el.clientHeight-60){map.cx=pt[1];map.cy=pt[0]}if(q<1)requestAnimationFrame(step);else done()}requestAnimationFrame(step)})}journey=target;map.cx=list[target].lng;map.cy=list[target].lat;drawMap(list);updateJourney(list)}

function setupPwa(){$('#installApp').onclick=installApp;if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('/sw.js').catch(()=>{});addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installApp').classList.remove('hide')});addEventListener('appinstalled',()=>{installPrompt=null;$('#installApp').classList.add('hide');toast('여기로를 앱으로 설치했어요')});addEventListener('offline',()=>toast('오프라인 모드로 전환했어요'));addEventListener('online',()=>toast('인터넷에 다시 연결됐어요'))}
async function installApp(){if(matchMedia('(display-mode: standalone)').matches){toast('이미 앱으로 실행 중이에요');return}if(!installPrompt){toast('브라우저 메뉴에서 홈 화면에 추가해 주세요');return}installPrompt.prompt();let result=await installPrompt.userChoice;if(result.outcome==='accepted')installPrompt=null;$('#installApp').classList.toggle('hide',!installPrompt)}

addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.close!==undefined){closeSheet();return}if(b.dataset.open){({help,newTrip:()=>tripForm(),settings}[b.dataset.open]||(()=>{}))();return}if(b.id==='smartImport'){smartImportSheet();return}if(b.id==='analyzeDoc'){await analyzeSmartDocument();return}if(b.id==='confirmImport'){await confirmSmartImport();return}if(b.dataset.day){selected=b.dataset.day;render();let s=document.querySelector(`[data-day-section="${selected}"]`);if(page==='schedule'&&s)s.scrollIntoView({behavior:'smooth'});return}if(b.dataset.switch){state.activeId=b.dataset.switch;selected='';journey=0;save();closeSheet();render();toast('여행을 전환했어요');return}if(b.dataset.edittrip){tripForm(state.trips.find(x=>x.id===b.dataset.edittrip));return}if(b.dataset.deltrip){if(deleteArmed!==b.dataset.deltrip){deleteArmed=b.dataset.deltrip;toast('한 번 더 누르면 삭제돼요');return}state.trips=state.trips.filter(x=>x.id!==b.dataset.deltrip);state.activeId=state.trips[0].id;save();tripsSheet();render();toast('여행을 삭제했어요');return}if(b.dataset.flight){flightForm(trip().flights.find(x=>x.id===b.dataset.flight));return}if(b.dataset.doc){let [id,n]=b.dataset.doc.split('|'),i=trip().items.find(x=>x.id===id);openDoc(i,+n);return}if(b.dataset.pin){setPage('schedule');setTimeout(()=>{let x=$('#item-'+b.dataset.pin);x?.scrollIntoView({behavior:'smooth',block:'center'});x?.classList.add('flash');setTimeout(()=>x?.classList.remove('flash'),1300)},80);return}if(b.dataset.act){let i=trip().items.find(x=>x.id===b.dataset.id);if(b.dataset.act==='edit'||b.dataset.act==='attach')itemForm(i);if(b.dataset.act==='del'){if(confirm('이 일정을 삭제할까요?')){trip().items=trip().items.filter(x=>x.id!==i.id);save();render();toast('일정을 삭제했어요')}}if(b.dataset.act==='dir')open(navUrl(i,true),'_blank');if(b.dataset.act==='map')open(navUrl(i,false),'_blank');if(b.dataset.act==='ics')ics([i],i.name);return}if(b.id==='formDelete'){let id=$('#itemForm').dataset.id;trip().items=trip().it addEventListener('submit',async e=>{e.preventDefault();let f=e.target,fd=new FormData(f);if(f.id==='itemForm'){let old=trip().items.find(x=>x.id===f.dataset.id),i=old||{id:uid(),userDocs:[]},oldPlace=i.place||'';for(let k of ['day','time','cat','name','place','mapUrl','move','alarm','memo'])i[k]=fd.get(k)||'';if(i.place!==oldPlace){i.lat=null;i.lng=null}i.userDocs=[...(i.userDocs||[]),...await filesData(fd.getAll('files').filter(x=>x.size))];await geocode(i);if(!old)trip().items.push(i);if(!save())return;selected=i.day;closeSheet();render();toast('일정을 저장했어요')}if(f.id==='tripForm'){let start=fd.get('start'),end=fd.get('end');if(end<start){toast('종료일을 확인해 주세요');return}let old=state.trips.find(x=>x.id===f.dataset.id);if(old&&old.items.some(i=>i.day<start||i.day>end)){toast('기존 일정이 포함되도록 기간을 설정해 주세요');return}let t=old||{id:uid(),flights:[],items:[],hero:''};Object.assign(t,{title:fd.get('title'),start,end,note:fd.get('note'),cities:fd.get('cities').split(',').map(x=>x.trim()).filter(Boolean)});if(!old){state.trips.push(t);state.activeId=t.id}if(!save())return;selected='';closeSheet();render();toast('여행을 저장했어요')}if(f.id==='flightForm'){let old=trip().flights.find(x=>x.id===f.dataset.id),x=old||{id:uid()};for(let k of ['from','fromCity','depart','to','toCity','arrive'])x[k]=fd.get(k);if(!old)trip().flights.push(x);if(!save())return;closeSheet();render();toast('항공편을 저장했어요')}});
$('#bgInput').onchange=async e=>{let f=e.target.files[0];if(f){trip().hero=await resize(await readFile(f),1800,.78);save();render();toast('배경을 변경했어요')}e.target.value=''};$('#importInput').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!validState(x))throw 0;state=x;state.activeId=state.trips.some(t=>t.id===state.activeId)?state.activeId:state.trips[0].id;save();closeSheet();render();toast('백업을 불러왔어요')}catch(_){toast('올바른 백업 파일이 아니에요')}e.target.value=''};
setInterval(()=>{let now=new Date(),key=iso(now)+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),seen='';try{seen=sessionStorage.getItem('yeogiro-alarm')||''}catch(e){}if(key===seen)return;let hits=trip().items.filter(i=>i.day===key.slice(0,10)&&i.alarm===key.slice(11));if(hits.length){try{sessionStorage.setItem('yeogiro-alarm',key)}catch(e){}let p=$('#alarmPop');p.innerHTML=`<b>⏰ ${hits.map(i=>esc(i.name)).join(' · ')}</b><br><small>${hits.map(i=>esc(i.time)).join(', ')} 일정 알람</small>`;p.classList.add('show');setTimeout(()=>p.classList.remove('show'),8000);try{let ac=new(window.AudioContext||window.webkitAudioContext),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(ac.currentTime+.18)}catch(e){}if(Notification.permission==='granted')hits.forEach(i=>new Notification('여기로 일정 알람',{body:i.time+' '+i.name}))}},15000);
