/* Toss reference adaptation: product UI tokens and explicit interaction states */
:root{
  color-scheme:light;
  --primary-blue:#3182f6;
  --primary-hover:#2272eb;
  --primary-active:#1b64da;
  --primary-disabled:#d0d5dc;
  --primary-text:#191f28;
  --background:#f7f8fa;
  --surface:#f9fafb;
  --surface-strong:#fff;
  --surface-muted:#f2f4f6;
  --control-soft-blue:#e8f3ff;
  --control-soft-blue-hover:#dbeeff;
  --control-soft-blue-active:#c9e2ff;
  --control-soft-blue-disabled:#f2f4f6;
  --line:#e5e8eb;
  --line-strong:#d1d6db;
  --text:#191f28;
  --muted:#8b95a1;
  --navy:#191f28;
  --blue:#3182f6;
  --accent:#3182f6;
  --orange:#3182f6;
  --accent-coral:#e42939;
  --coral-soft:#fff0f1;
  --gold:#8b95a1;
  --on-primary:#fff;
  --on-accent:#fff;
  --focus-ring:rgba(49,130,246,.34);
  --radius-card:16px;
  --radius-control:12px;
  --shadow:none;
  --shadow-soft:none;
  --container:960px;
  --ease:cubic-bezier(.2,.8,.2,1)
}
html,body{background:var(--background)}
body{background-image:none;font-family:"Toss Product Sans","LINE Seed KR","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--text);font-weight:400;letter-spacing:-.018em}

button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
button[disabled],button[aria-busy="true"]{cursor:not-allowed;opacity:1;transform:none}

button[aria-busy="true"]::after{content:"";position:absolute;inset:50% auto auto 50%;width:16px;height:16px;margin:-8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;color:#fff;animation:sync-spin .7s linear infinite}

async function dataSafetySheet(){try{let x=await YeogiroStore.dataSafety(trip()),syncState=x.conflict?['확인 필요','다른 기기 변경사항과 비교가 필요합니다.','attention']:x.pending?[`대기 ${x.pending}건`,'이 기기 변경사항을 서버에 저장하는 중입니다.','attention']:x.connected?['저장 완료',x.lastSync?`최근 동기화 ${shortDate(x.lastSync,true)}`:'서버와 연결된 여행입니다.','']:['연결 준비 중','인터넷에 연결하면 서버 저장을 시작합니다.','attention'],fileState=x.files.mismatch?[`정보 확인 ${x.files.mismatch}개`,'원본은 있지만 저장된 파일 정보와 크기 또는 형식이 다릅니다.','attention']:x.files.missing?[`다른 기기 ${x.files.missing}개`,'파일명과 연결 정보는 유지되며 원본이 있는 기기에서 열 수 있습니다.','attention']:x.files.localOnly?[`이 기기 ${x.files.localOnly}개`,'앱 삭제 전에 JSON 백업으로 원본을 보관하세요.','attention']:['정상 보관',x.files.total?`${x.files.local}개 원본을 이 기기에서 열 수 있습니다.`:'등록된 예약 서류나 대표사진 원본이 없습니다.',''],recoveryState=x.role==='owner'?(x.recoveryConfigured===true?['생성됨','휴대폰 교체에 대비한 소유권 복구키가 설정돼 있습니다.','']:x.recoveryConfigured===false?['미생성','소유권 복구키를 만들어 안전한 곳에 보관하세요.','attention']:['확인 불가','인터넷에 연결해 복구키 상태를 확인하세요.','attention']):['소유자만 설정',x.connected?'소유자가 복구키를 관리합니다.':'여행 연결 후 확인할 수 있습니다.',''],storageState=x.storage.supported?[`${fileSize(x.storage.used)} 사용`,x.storage.quota?`이 브라우저에서 약 ${fileSize(Math.max(0,x.storage.quota-x.storage.used))}를 더 사용할 수 있습니다. 예약 원본 ${fileSize(x.files.bytes)} 포함.`:`예약 원본 ${fileSize(x.files.bytes)}를 이 기기에 보관 중입니다.`,'']:['확인 불가',`예약 원본 ${fileSize(x.files.bytes)}를 이 기기에 보관 중입니다.`,''],protectionState=x.storage.persisted===true?['설정됨','브라우저가 이 기기의 여행 파일을 우선 보관하도록 설정했습니다.','']:x.storage.canPersist?['설정 필요','브라우저가 이 기기의 여행 파일을 우선 보관하도록 설정합니다.','attention']:['지원 안 함','JSON 백업을 함께 보관하면 앱 삭제나 기기 변경에 대비할 수 있습니다.',''],row=(icon,title,state,detail,tone='')=>`<div class="safety-row"><span class="safety-mark" aria-hidden="true">${icon}</span><span class="safety-copy"><b>${title}</b><small>${esc(detail)}</small></span><span class="safety-state ${tone}">${esc(state)}</span></div>`;openSheet(`<h2>데이터 보관 상태</h2><div class="form"><div class="help-card"><b>${esc(trip().title)}</b>앱을 삭제하거나 브라우저 데이터를 지우기 전에 아래 상태를 확인하세요.</div><section class="management-section"><div class="management-head"><h3>보관 상태</h3><small>앱 v${APP_VERSION}</small></div><div class="data-safety-summary">${row('☁️','일정 및 예약정보',syncState[0],syncState[1],syncState[2])}${row('📎','파일 원본',fileState[0],fileState[1],fileState[2])}${row('💾','저장 공간',storageState[0],storageState[1],storageState[2])}${row('📌','파일 보관 설정',protectionState[0],protectionState[1],protectionState[2])}${row('🔑','소유권 복구키',recoveryState[0],recoveryState[1],recoveryState[2])}${row('⬇️','최근 JSON 백업',x.lastBackup?shortDate(x.lastBackup,true):'기록 없음',x.lastBackup?'이 기기에서 만든 최근 백업 시각입니다.':'아직 이 기기에서 JSON 백업을 만들지 않았습니다.',x.lastBackup?'':'attention')}</div></section><div class="safety-actions"><button class="save" data-safety-sync>지금 동기화</button><button data-safety-backup>JSON 백업</button>${x.storage.canPersist&&x.storage.persisted!==true?'<button data-safety-protect>보관 설정</button>':''}${x.files.mismatch?'<button data-safety-repair>파일 정보 정리</button>':''}${x.files.missing?'<button data-safety-files>예약 서류 확인</button>':''}${x.role==='owner'?'<button data-safety-recovery>복구 코드 관리</button>':''}<button data-safety-update>업데이트 확인</button></div><p class="memo">앱 업데이트는 데이터를 지우지 않습니다. 앱 삭제나 브라우저 데이터 삭제는 이 기기의 원본 파일과 연결 정보를 지울 수 있습니다.</p><button class="cancel" data-close>닫기</button></div>`)}catch(error){toast(error.message||'데이터 보관 상태를 확인하지 못했습니다.')}}
function searchResults(query){return YeogiroData.searchTrip(trip(),query)}
function renderSearchResults(query){let box=$('#tripSearchResults'),groups=searchResults(query),count=Object.values(groups).flat().length;box.innerHTML=query?(count?`<div class="search-results">${Object.entries(groups).map(([name,list])=>list.length?`<section class="search-group"><h3>${name}</h3>${list.map(x=>`<button class="search-result" data-search-type="${x.type}" data-search-id="${x.id}"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></button>`).join('')}</section>`:'').join('')}</div>`:'<div class="empty card"><b>검색 결과가 없습니다.</b><br>일정, 항공편, 숙소, 예약서류에서 검색합니다.</div>'):'<p class="memo">여행의 일정, 장소, 도시, 편명, 공항코드, 숙소, 메모, 예약번호와 서류명을 함께 찾습니다.</p>'}
function searchSheet(){openSheet(`<h2>여행 검색</h2><div class="form"><div class="field"><label>검색어</label><input id="tripSearchInput" type="search" inputmode="search" autocomplete="off" placeholder="일정, 숙소, 항공편, 예약번호 검색"></div><div id="tripSearchResults"></div><button class="cancel" data-close>닫기</button></div>`);let input=$('#tripSearchInput'),timer;input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>renderSearchResults(input.value),70)});renderSearchResults('');setTimeout(()=>input.focus(),60)}
function backupPreviewSheet(raw){let preview=YeogiroStore.previewBackup(raw,state),s=preview.summary,f=preview.fileSummary;backupPending=raw;openSheet(`<h2>백업 내용 확인</h2><div class="form"><div class="backup-summary"><div><b>${s.trips||0}</b><small>여행</small></div><div><b>${s.items||0}</b><small>일정</small></div><div><b>${s.flights||0}</b><small>항공편</small></div><div><b>${s.lodgings||0}</b><small>숙소</small></div><div><b>${f.included||0}</b><small>포함 원본</small></div><div><b>${f.missing||0}</b><small>누락 원본</small></div></div>${f.missing?`<div class="review-callout"><b>원본 누락 ${f.missing}개</b>해당 파일은 이름과 연결 정보만 복원됩니다.</div>`:'<div class="review-callout plain"><b>원본 복원 가능</b>백업에 포함된 PDF·사진 원본 ${f.included||0}개를 이 기기에 복원합니다.</div>'}${preview.conflicts.length?`<div class="review-callout"><b>기존 여행과 충돌</b>${esc(preview.conflicts.map(x=>x.title).join(' · '))}</div>`:'<p class="memo">기존 여행과 ID가 겹치지 않습니다.</p>'}<button class="management-primary-action" data-backup-mode="overwrite">기존 여행 덮어쓰기</button><button class="addline" data-backup-mode="new">새 여행으로 가져오기</button><button class="cancel" data-close>취소</button></div>`)}
async function applyBackup(mode,button){if(!backupPending||button.disabled)return;button.disabled=true;try{let preview=YeogiroStore.previewBackup(backupPending,state),next=await YeogiroStore.importBackup(backupPending,{mode,current:state});if(!validState(next))throw new Error('백업 데이터의 날짜 또는 시간 형식을 확인해 주세요.');state=next;state.activeId=state.trips.some(t=>t.id===state.activeId)?state.activeId:state.trips[0].id;await YeogiroStore.persist(state);backupPending=null;closeSheet();render();toast(`${mode==='new'?'백업을 새 여행으로 가져왔습니다.':'백업의 여행을 안전하게 복원했습니다.'}${preview.fileSummary.included?` 원본 ${preview.fileSummary.included}개가 이 기기에 복원됐습니다.`:''}`)}catch(error){button.disabled=false;toast(error.message||'백업을 복원하지 못했습니다. 현재 데이터는 유지됩니다.')}}
function shortDate(value,withTime=false){if(!value)return'기록 없음';let d=new Date(value);if(Number.isNaN(+d))return'기록 없음';return new Intl.DateTimeFormat('ko-KR',withTime?{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}:{year:'numeric',month:'short',day:'numeric'}).format(d)}
function roleName(role){return role==='owner'?'소유자':role==='editor'?'편집 가능':'보기 전용'}
function participantName(member,currentMemberId=''){let name=member?.displayName??member?.display_name,id=member?.id||'';if(['관리자','여행 관리자'].includes(name))return id&&id===currentMemberId?'소유자':'여행 만든 사람';if(name==='소유자')return id&&id===currentMemberId?'나':'여행 만든 사람';if(name==='초대받은 사람')return'동행자';return name||'이름 없는 참여자'}
function inviteState(invite){let expired=invite.expires_at&&new Date(invite.expires_at)<=new Date;if(invite.max_uses===1&&invite.use_count>=1)return{label:'사용 완료',active:false};if(invite.revoked_at)return{label:'비활성',active:false};if(expired)return{label:'만료',active:false};return{label:'활성',active:true}}
function sessionPresentation(session){let generic=!session.device_name||['기존 기기','이름 없는 기기'].includes(session.device_name),platform=session.platform&&!['기기 정보 없음','플랫폼 정보 없음'].includes(session.platform)?session.platform:'',title=generic?(session.current?'이 기기':'이전에 연결한 기기'):session.device_name,autoName=platform&&title.startsWith(platform+' ·'),last=session.last_seen_at||session.created_at,days=Math.max(0,Math.floor((Date.now()-new Date(last).getTime())/86400000)),age=!session.current&&days>=90?'오래된 연결':!session.current&&days>=30?'30일 이상 사용하지 않음':'';return{title,meta:[autoName?'':platform,session.client_type==='pwa'?'앱으로 설치됨':'브라우저',session.current?'현재 기기':`마지막 사용 ${shortDate(last,true)}`,age].filter(Boolean).join(' · ')}}
function recoverSheet(tripId=''){let known=String(tripId||'').trim();openSheet(`<h2>기존 여행 복구</h2><form class="form" id="recoveryForm"><div class="help-card"><b>새 기기에서 여행 복구</b>복구 전에는 현재 기기의 여행을 삭제하거나 덮어쓰지 않습니다.</div>${known?`<div class="recovery-card"><b>복구할 여행</b><small>${esc(known)}</small></div><input type="hidden" name="trip" value="${esc(known)}">`:`<div class="field"><label>여행 ID 또는 복구 링크</label><input name="trip" type="text" inputmode="url" autocomplete="off" placeholder="복구 링크를 붙여 넣으세요" required></div>`}<div class="field"><label>소유권 복구키</label><input name="recoveryKey" type="password" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" required></div><button class="save management-primary-action">이 기기에서 복구</button><button type="button" class="cancel" data-cancel-recovery>취소</button></form>`)}
function recoveryResult(result){openSheet(`<h2>소유권 복구키 보관</h2><div class="form"><div class="recovery-card"><b>이 복구키는 지금 한 번만 표시됩니다</b><small>휴대폰 교체나 브라우저 데이터 삭제에 대비해 안전한 곳에 보관하세요.</small><code class="recovery-key" id="recoveryKeyValue">${esc(result.recoveryKey)}</code><button data-copy-recovery>복구키 복사</button></div><div class="recovery-note">복구키를 잃어버리면 현재 소유자 기기에서 새로 발급해야 합니다. 재발급하면 이전 복구키는 즉시 무효화됩니다.</div><button class="cancel" data-my-share>확인</button></div>`)}

function displayNameSheet(currentName){openSheet(`<h2>표시명 변경</h2><form class="form" id="displayNameForm"><div class="field"><label>다른 참여자에게 보일 이름</label><input name="displayName" maxlength="40" autocomplete="name" value="${esc(currentName)}" required></div><div class="form-actions"><button class="save">저장</button><button type="button" class="cancel" data-my-share>취소</button></div></form>`)}
function deviceLinkSheet(tripId=''){let known=String(tripId||'').trim();openSheet(`<h2>공유 여행 연결</h2><form class="form" id="deviceLinkForm"><div class="help-card"><b>내 권한 그대로 연결</b>다른 기기에서 만든 1회용 연결 코드를 입력하세요. 새 사람으로 중복 등록되지 않습니다.</div>${known?`<input type="hidden" name="trip" value="${esc(known)}"><div class="recovery-card"><b>연결할 여행</b><small>${esc(known)}</small></div>`:`<div class="field"><label>여행 ID 또는 연결 링크</label><input name="trip" inputmode="url" autocomplete="off" required></div>`}<div class="field"><label>새 기기 연결 코드</label><input name="code" type="password" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" required></div><button class="save management-primary-action">이 기기에 연결</button><button type="button" class="cancel" data-close>취소</button></form>`)}
function deviceCodeResult(result){openSheet(`<h2>새 기기 연결 코드</h2><div class="form"><div class="recovery-card"><b>15분 동안 한 번만 사용할 수 있습니다</b><small>새 기기에서 연결 링크를 연 뒤 아래 코드를 입력하세요.</small><code class="recovery-key" id="deviceCodeValue">${esc(result.code)}</code><button data-copy-device-code>연결 코드와 링크 복사</button></div><p class="memo">이 코드는 내 권한만 새 기기에 연결하며, 사용하거나 시간이 지나면 자동으로 무효화됩니다.</p><button class="cancel" data-my-share>확인</button></div>`)}
