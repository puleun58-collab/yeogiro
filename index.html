let state=load();if(!state.activeId||!state.trips.some(t=>t.id===state.activeId))state.activeId=state.trips[0].id;let durableSnapshot=JSON.stringify(state),selected='',page='schedule',journey=0,map={zoom:13,cx:139.7,cy:35.66,routes:[]},mapGen=0,deleteArmed='',saveError=false;save();
function validState(x){let scalar=v=>typeof v==='string',timeOk=v=>scalar(v)&&/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(v),dateOk=v=>scalar(v)&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&iso(parse(v))===v,doc=d=>d&&scalar(d.name)&&scalar(d.data)&&/^data:/.test(d.data),flight=f=>f&&['id','from','fromCity','to','toCity'].every(k=>scalar(f[k]))&&timeOk(f.depart)&&timeOk(f.arrive);return!!(x&&Array.isArray(x.trips)&&x.trips.length&&x.trips.every(t=>t&&scalar(t.id)&&scalar(t.title)&&dateOk(t.start)&&dateOk(t.end)&&t.end>=t.start&&Array.isArray(t.cities)&&t.cities.every(scalar)&&Array.isArray(t.flights)&&t.flights.every(flight)&&Array.isArray(t.items)&&t.items.every(i=>i&&scalar(i.id)&&dateOk(i.day)&&i.day>=t.start&&i.day<=t.end&&timeOk(i.time)&&(!i.alarm||timeOk(i.alarm))&&scalar(i.name)&&Array.isArray(i.userDocs)&&i.userDocs.every(doc))))}function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(validState(x))return x}catch(e){}return sample()} function save(){try{let next=JSON.stringify(state);localStorage.setItem(KEY,next);durableSnapshot=next;saveError=false;return true}catch(e){state=JSON.parse(durableSnapshot);saveError=true;toast('저장 공간이 부족하거나 차단됐어요');setTimeout(render,0);return false}} function trip(){return state.trips.find(t=>t.id===state.activeId)||state.trips[0]}

function renderSchedule(){let t=trip();$('#flights').innerHTML=t.flights.length?t.flights.map(f=>`<button class="card flight" data-flight="${f.id}"><div><strong>${esc(f.from)}</strong><small>${esc(f.fromCity)} · ${esc(f.depart)}</small></div><div class="plane">✈</div><div><strong>${esc(f.to)}</strong><small>${esc(f.toCity)} · ${esc(f.arrive)}</small></div></button>`).join(''):'<div class="empty card">등록된 항공편이 없어요</div>';let docs=t.items.flatMap(i=>(i.userDocs||[]).map((d,n)=>({d,i,n})));$('#docs').innerHTML=docs.length?docs.map(x=>`<button class="doc" data-doc="${x.i.id}|${x.n}"><span>📎</span><div><b>${esc(x.d.name)}</b><small>${esc(x.i.day)} · ${esc(x.i.name)}</small></div></button>`).join(''):'<div class="empty">첨부한 예약 서류가 없어요</div>';let range=dateRange(t.start,t.end);$('#items').innerHTML=range.map(d=>{let list=t.items.filter(i=>i.day===d).sort((a,b)=>a.time.localeCompare(b.time));return`<section data-day-section="${d}"><h2 class="day-head">${fmt(d)} · ${esc(cityFor(t,range.indexOf(d)))}</h2>${list.length?list.map(itemCard).join(''):'<div class="empty card">아직 일정이 없어요</div>'}</section>`}).join('')}

async function moveJourney(dir){let list=trip().items.filter(i=>i.day===selected&&i.lat&&i.lng).sort((a,b)=>a.time.localeCompare(b.time)),target=Math.max(0,Math.min(list.length-1,journey+dir));if(target===journey)return;if(dir>0){let r=map.routes[journey]||[[list[journey].lat,list[journey].lng],[list[target].lat,list[target].lng]],dur=Math.min(4000,Math.max(1600,r.length*35)),st=performance.now(),z=map.zoom,el=$('#map');await new Promise(done=>{function step(now){let q=Math.min(1,(now-st)/dur),idx=Math.min(r.length-1,Math.floor(q*(r.length-1))),pt=r[idx],c=project(map.cy,map.cx,z),p=project(pt[0],pt[1],z),xy=[p.x-(c.x-el.clientWidth/2),p.y-(c.y-el.clientHeight/2)];placeCharacter(xy,list[target].move,Math.floor(now/180)%2);if(xy[0]<60||xy[0]>el.clientWidth-60||xy[1]<60||xy[1]>el.clientHeight-60){map.cx=pt[1];map.cy=pt[0]}if(q<1)requestAnimationFrame(step);else done()}requestAnimationFrame(step)})}journey=target;map.cx=list[target].lng;map.cy=list[target].lat;drawMap(list);updateJourney(list)}
