function settings(){let s=YeogiroStore.status(),role=s.roleByTrip[trip().id]||'owner';openSheet(`<h2>설정</h2><div class="settings"><button data-open="help">📖 여기로 사용법</button><button id="installFromSettings">📲 앱으로 설치</button>${role!=='viewer'?'<button id="editCurrent">✏️ 여행 정보 편집</button>':''}${role==='owner'?'<button id="tripShare">🔗 여행 공유 및 권한</button>':''}${role!=='viewer'?'<button id="changeBg">📷 배경 사진 변경</button>':''}<button id="notify">🔔 알림 권한 요청</button><button id="exportJson">⬇️ JSON 내보내기</button><button id="importJson">⬆️ JSON 불러오기</button><button id="allIcs">📅 전체 일정 캘린더</button>${role==='owner'?'<button class="delete" id="resetAll">⚠️ 전체 초기화 (두 번 탭)</button>':''}</div>${role==='viewer'?'<div class="help-card"><b>보기 전용 여행</b>일정과 예약정보를 확인할 수 있으며 여행 관리자 또는 편집 가능한 사람만 수정할 수 있어요.</div>':''}<p class="memo">PDF와 사진 원본은 비용 없이 저장한 기기에만 보관됩니다.</p><button class="addline" data-close>닫기</button>`);$('#installFromSettings').onclick=installApp}
function searchResults(query){let t=trip(),q=YeogiroData.normalize(query),hit=(...values)=>values.some(v=>YeogiroData.normalize(v).includes(q)),groups={항공편:[],숙소:[],일정:[],예약서류:[]};if(!q)return groups;for(let f of t.flights||[])if(hit(f.airline,f.flightNumber,f.from,f.to,f.fromCity,f.toCity,f.reservationNumber))groups.항공편.push({type:'flight',id:f.id,title:`${f.flightNumber||'항공편'} · ${f.from||'—'} → ${f.to||'—'}`,sub:`${f.departDate} · ${f.depart}`});for(let l of t.lodgings||[])if(hit(l.name,l.address,l.reservationNumber))groups.숙소.push({type:'lodging',id:l.id,title:l.name,sub:`${l.checkInDate} 체크인`});for(let i of t.items||[])if(hit(i.name,i.place,i.reservationNumber,i.provider))groups.일정.push({type:'item',id:i.id,title:i.name,sub:`${i.day} · ${i.time}${i.place?' · '+i.place:''}`});for(let x of allDocuments())if(hit(x.doc.name,x.label))groups.예약서류.push({type:'document',id:x.doc.id,title:x.doc.name,sub:x.label});return groups}
function renderSearchResults(query){let box=$('#tripSearchResults'),groups=searchResults(query),count=Object.values(groups).flat().length;box.innerHTML=query?(count?`<div class="search-results">${Object.entries(groups).map(([name,list])=>list.length?`<section class="search-group"><h3>${name}</h3>${list.map(x=>`<button class="search-result" data-search-type="${x.type}" data-search-id="${x.id}"><b>${esc(x.title)}</b><small>${esc(x.sub)}</small></button>`).join('')}</section>`:'').join('')}</div>`:'<div class="empty card">일치하는 여행 정보가 없습니다.</div>'):'<p class="memo">일정명, 장소, 편명, 공항코드, 숙소명, 예약번호와 파일명을 검색할 수 있습니다.</p>'}

async function applyBackup(mode,button){if(!backupPending||button.disabled)return;button.disabled=true;try{let next=await YeogiroStore.importBackup(backupPending,{mode,current:state});if(!validState(next))throw new Error('백업 데이터의 날짜 또는 시간 형식을 확인해 주세요.');state=next;state.activeId=state.trips.some(t=>t.id===state.activeId)?state.activeId:state.trips[0].id;await YeogiroStore.persist(state);backupPending=null;closeSheet();render();toast(mode==='new'?'백업을 새 여행으로 가져왔습니다.':'백업의 여행을 안전하게 복원했습니다.')}catch(error){button.disabled=false;toast(error.message||'백업을 복원하지 못했습니다. 현재 데이터는 유지됩니다.')}}
function shortDate(value,withTime=false){if(!value)return'기록 없음';let d=new Date(value);if(Number.isNaN(+d))return'기록 없음';return new Intl.DateTimeFormat('ko-KR',withTime?{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}:{year:'numeric',month:'short',day:'numeric'}).format(d)}
function roleName(role){return role==='owner'?'여행 관리자':role==='editor'?'편집 가능':'보기 전용'}
function inviteState(invite){let expired=invite.expires_at&&new Date(invite.expires_at)<=new Date;if(invite.max_uses===1&&invite.use_count>=1)return{label:'사용 완료',active:false};if(invite.revoked_at)return{label:'비활성',active:false};if(expired)return{label:'만료',active:false};return{label:'활성',active:true}}
function sessionPresentation(session){let generic=!session.device_name||['기존 기기','이름 없는 기기'].includes(session.device_name),platform=session.platform&&!['기기 정보 없음','플랫폼 정보 없음'].includes(session.platform)?session.platform:'',title=generic?(session.current?'이 기기':'이전에 연결한 기기'):session.device_name,autoName=platform&&title.startsWith(platform+' ·'),last=session.last_seen_at||session.created_at,days=Math.max(0,Math.floor((Date.now()-new Date(last).getTime())/86400000)),age=!session.current&&days>=90?'오래된 연결':!session.current&&days>=30?'30일 이상 사용하지 않음':'';return{title,meta:[autoName?'':platform,session.client_type==='pwa'?'앱':'브라우저',session.current?'사용 중':`마지막 사용 ${shortDate(last,true)}`,age].filter(Boolean).join(' · ')}}
function recoverSheet(tripId=''){let known=String(tripId||'').trim();openSheet(`<h2>기존 여행 다시 연결</h2><form class="form" id="recoveryForm"><div class="help-card"><b>새 기기에서 여행 연결</b>연결 전에는 현재 기기의 여행을 삭제하거나 덮어쓰지 않습니다.</div>${known?`<div class="recovery-card"><b>연결할 여행</b><small>${esc(known)}</small></div><input type="hidden" name="trip" value="${esc(known)}">`:`<div class="field"><label>여행 ID 또는 복구 링크</label><input name="trip" type="text" inputmode="url" autocomplete="off" placeholder="복구 링크를 붙여 넣으세요" required></div>`}<div class="field"><label>여행 복구 코드</label><input name="recoveryKey" type="password" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" required></div><button class="save">이 기기에 여행 연결</button><button type="button" class="cancel" data-cancel-recovery>취소</button></form>`)}

    openSheet(`<h2>공유 및 기기 관리</h2><div class="form"><section class="recovery-card"><b>여행 복구 코드</b><small>${x.recoveryConfigured?`발급됨 · ${shortDate(x.recoveryKeyCreatedAt)}`:'휴대폰을 바꾸거나 브라우저 데이터가 지워졌을 때 이 여행을 다시 연결하는 코드입니다.'}</small><button data-issue-recovery data-rotate="${x.recoveryConfigured?'1':'0'}">${x.recoveryConfigured?'복구 코드 새로 만들기':'복구 코드 만들기'}</button></section><section class="management-section"><div class="management-head"><h3>함께 쓰는 사람</h3><small>${x.members.length}명</small></div><div class="management-list">${members}</div></section><section class="management-section"><div class="management-head"><h3>연결된 기기</h3><small>${activeSessions.length}대</small></div><div class="management-list">${sessions||'<div class="management-empty">연결된 기기가 없습니다.</div>'}</div></section><section class="management-section"><div class="management-head"><h3>새 초대</h3><small>기본 7일</small></div><div class="field"><label>권한</label><select id="inviteRole"><option value="editor">편집 가능</option><option value="viewer">보기 전용</option></select></div><div class="field"><label>사용 범위</label><select id="inviteUsage"><option value="once">한 명만 사용</option><option value="multi">여러 명 사용</option></select></div><button class="management-primary-action" data-create-invite>초대 링크 만들기</button></section><section class="management-section"><div class="management-head"><h3>초대 링크</h3><small>${invites.length}개</small></div><div class="management-list">${invites.length?invites.map(i=>{let state=inviteState(i);return`<div class="access-row"><span class="access-copy"><b>${roleName(i.role)} <span class="state-label ${state.active?'active':''}">${state.label}</span></b><small>${i.max_uses===1?'1회용':'다회용'} · 생성 ${shortDate(i.created_at)} · ${i.expires_at?shortDate(i.expires_at)+'까지':'만료 없음'}${i.use_count?` · ${i.use_count}회 사용`:''}</small></span>${state.active?`<span class="access-actions"><button class="delete" data-revoke-invite="${i.id}">링크 취소</button></span>`:''}</div>`}).join(''):'<div class="management-empty">만든 초대 링크가 없습니다.</div>'}</div></section><button class="cancel" data-close>닫기</button></div>`)
  }catch(e){toast(e.message||'공유 설정을 열지 못했어요')}
}
