<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163b56">
  <title>오프라인 | 여기로</title>
  <style>
    :root{color-scheme:light dark;font-family:"Apple SD Gothic Neo","Noto Sans KR",ui-sans-serif,sans-serif;background:#edf2f3;color:#142733}
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;background:#edf2f3}
    main{width:min(100%,520px);padding:34px;border:1px solid rgba(22,59,86,.12);border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(33,67,82,.09)}
    img{width:72px;height:72px;border-radius:18px}h1{margin:24px 0 12px;font-size:32px;letter-spacing:-.05em}p{margin:0 0 26px;color:#647681;line-height:1.7}
    button{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:#163b56;color:#fff;font:inherit;font-weight:800;cursor:pointer}
    button:focus-visible{outline:3px solid rgba(234,106,74,.48);outline-offset:3px}
    @media(prefers-color-scheme:dark){:root,body{background:#0d1b23;color:#e6f0f1}main{border-color:rgba(210,231,235,.11);background:#172b35}p{color:#9aadb5}button{background:#d7e9ed;color:#163b56}}
  </style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192.png" alt="">
    <h1>연결을 기다리고 있어요</h1>
    <p>저장한 여행 일정은 기기에서 계속 확인할 수 있습니다. 지도와 문서 분석은 인터넷에 다시 연결된 뒤 이용해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 연결하기</button>
  </main>
</body>
</html>
