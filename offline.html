<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fa">
  <title>오프라인 | 여기로</title>
  <style>
    :root{color-scheme:light;--primary-blue:#5b7bc4;--primary-text:#151b2b;--background:#f7f9fa;--surface:white;--muted:color-mix(in srgb,var(--primary-text) 64%,var(--background));--line:color-mix(in srgb,var(--primary-text) 12%,transparent);--on-primary:#0b1020;--primary-hover:color-mix(in srgb,var(--primary-blue) 94%,var(--background));--primary-active:color-mix(in srgb,var(--primary-blue) 88%,var(--background));--focus-ring:var(--primary-blue);font-family:"Apple SD Gothic Neo","Noto Sans KR",ui-sans-serif,sans-serif;background:var(--background);color:var(--primary-text)}
    *{box-sizing:border-box}body{min-height:100dvh;margin:0;padding:24px;display:grid;place-items:center;background:var(--background)}
    main{width:min(100%,520px);padding:34px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:0 18px 55px color-mix(in srgb,var(--primary-text) 7%,transparent)}
    img{width:72px;height:72px;border-radius:18px}h1{margin:24px 0 12px;font-size:32px;letter-spacing:-.05em}p{margin:0 0 26px;color:var(--muted);line-height:1.7}
    button{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--primary-blue);color:var(--on-primary);font:inherit;font-weight:800;cursor:pointer}button:hover{background:var(--primary-hover)}button:active{background:var(--primary-active)}
    button:focus-visible{outline:3px solid var(--focus-ring);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192-v7.png" alt="">
    <h1>연결을 기다리고 있어요</h1>
    <p>저장한 여행 일정은 기기에서 계속 확인할 수 있습니다. 지도와 문서 분석은 인터넷에 다시 연결된 뒤 이용해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 연결하기</button>
  </main>
</body>
</html>
